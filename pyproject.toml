[project]
name = "qrc"
version = "0.0.0"
description = ""
authors = [{ name = "Alessandro Candido", email = "candido.ale@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["qibocal", "qibolab", "qibo", "qibocal-widgets[marimo]"]

[dependency-groups]
dev = ["pudb>=2024.1.3,<2025", "ipython>=8.12.0,<9"]
# drivers of the Qblox clusters in use (firmware 0.12), and of the TWPA pump
qblox = [
  "qblox-instruments==0.17.1",
  # qblox-instruments 0.17 imports qcodes.instrument.base, removed in 0.57
  "qcodes<0.57",
  "qcodes_contrib_drivers",
  "lark",
  "pyvisa-py",
]
qm = ["qm-qua"]

[tool.uv]
package = false
default-groups = ["dev"]
# use the submodule, also in place of the source chosen by qibocal-widgets
override-dependencies = ["qibocal"]

[tool.uv.sources]
qibocal = { path = "qibocal", editable = true }
qibolab = { path = "qibolab", editable = true }
qibocal-widgets = { git = "https://github.com/qiboteam/qibocal-widgets", branch = "main" }
